  - id: profit_under_budget_direction
    question: 本月哪些酒店经营利润未达预算？
    time_scope: "202601"
    expected:
      skill_id:
      metric_code: OPERATING_PROFIT
      compare_mode: budget
      variance_direction: below
      time_scope: "202601"
      requested_hotels: []
      requested_areas: []
    sql_assertions:
      contains:
        - OPERATING_PROFIT_MTD_A < o.OPERATING_PROFIT_MTD_B
        - ORDER BY (o.OPERATING_PROFIT_MTD_A - o.OPERATING_PROFIT_MTD_B) ASC
