version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: hotel-ai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hotel_ai
      MYSQL_USER: hotel_ai_user
      MYSQL_PASSWORD: change_me
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  auth-service:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.backend
    container_name: hotel-ai-auth
    working_dir: /app/backend/apps/auth-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8105
    env_file:
      - backend/.env
    volumes:
      - .:/app
    ports:
      - "8105:8105"

  metric-service:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.backend
    container_name: hotel-ai-metric
    working_dir: /app/backend/apps/metric-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8102
    env_file:
      - backend/.env
    volumes:
      - .:/app
    ports:
      - "8102:8102"

  semantic-service:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.backend
    container_name: hotel-ai-semantic
    working_dir: /app/backend/apps/semantic-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8101
    env_file:
      - backend/.env
    volumes:
      - .:/app
    ports:
      - "8101:8101"

  sql-guardrail-service:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.backend
    container_name: hotel-ai-sql-guardrail
    working_dir: /app/backend/apps/sql-guardrail-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8103
    env_file:
      - backend/.env
    volumes:
      - .:/app
    ports:
      - "8103:8103"

  db-executor-service:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.backend
    container_name: hotel-ai-db-executor
    working_dir: /app/backend/apps/db-executor-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8106
    env_file:
      - backend/.env
    volumes:
      - .:/app
    ports:
      - "8106:8106"
    depends_on:
      - mysql

  explanation-service:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.backend
    container_name: hotel-ai-explanation
    working_dir: /app/backend/apps/explanation-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8104
    env_file:
      - backend/.env
    volumes:
      - .:/app
    ports:
      - "8104:8104"

  audit-service:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.backend
    container_name: hotel-ai-audit
    working_dir: /app/backend/apps/audit-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8107
    env_file:
      - backend/.env
    volumes:
      - .:/app
      - /mnt/data:/mnt/data
    ports:
      - "8107:8107"

  ai-query-service:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.backend
    container_name: hotel-ai-query
    working_dir: /app/backend/apps/ai-query-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8100
    env_file:
      - backend/.env
    volumes:
      - .:/app
    ports:
      - "8100:8100"
    depends_on:
      - auth-service
      - metric-service
      - semantic-service
      - sql-guardrail-service
      - db-executor-service
      - explanation-service
      - audit-service

  frontend:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.frontend
    container_name: hotel-ai-frontend
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    depends_on:
      - ai-query-service

volumes:
  mysql_data:
