x-backend-env: &backend_env
  AUTH_SERVICE_URL: http://auth-service:8105
  SEMANTIC_SERVICE_URL: http://semantic-service:8101
  METRIC_SERVICE_URL: http://metric-service:8102
  SQL_GUARDRAIL_SERVICE_URL: http://sql-guardrail-service:8103
  EXPLANATION_SERVICE_URL: http://explanation-service:8104
  DB_EXECUTOR_SERVICE_URL: http://db-executor-service:8106
  AUDIT_SERVICE_URL: http://audit-service:8107
  DB_HOST: mysql
  USE_LOCAL_WAREHOUSE: "1"
  WAREHOUSE_DIR: /app/backend/runtime/warehouse
  REAL_DATA_DIR: /app/real-data

x-backend-volumes: &backend_volumes
  - .:/app

services:
  mysql:
    image: mysql:8.0
    container_name: hotel-ai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hotel_ai
      MYSQL_USER: hotel_ai_user
      MYSQL_PASSWORD: change_me
    volumes:
      - mysql_data:/var/lib/mysql

  auth-service:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.backend
    image: hotel-ai-backend:local
    container_name: hotel-ai-auth
    restart: unless-stopped
    working_dir: /app/backend/apps/auth-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8105
    env_file:
      - path: backend/.env
        required: false
    environment: *backend_env
    volumes: *backend_volumes

  metric-service:
    image: hotel-ai-backend:local
    container_name: hotel-ai-metric
    restart: unless-stopped
    working_dir: /app/backend/apps/metric-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8102
    env_file:
      - path: backend/.env
        required: false
    environment: *backend_env
    volumes: *backend_volumes

  semantic-service:
    image: hotel-ai-backend:local
    container_name: hotel-ai-semantic
    restart: unless-stopped
    working_dir: /app/backend/apps/semantic-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8101
    env_file:
      - path: backend/.env
        required: false
    environment: *backend_env
    volumes: *backend_volumes

  sql-guardrail-service:
    image: hotel-ai-backend:local
    container_name: hotel-ai-sql-guardrail
    restart: unless-stopped
    working_dir: /app/backend/apps/sql-guardrail-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8103
    env_file:
      - path: backend/.env
        required: false
    environment: *backend_env
    volumes: *backend_volumes

  db-executor-service:
    image: hotel-ai-backend:local
    container_name: hotel-ai-db-executor
    restart: unless-stopped
    working_dir: /app/backend/apps/db-executor-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8106
    env_file:
      - path: backend/.env
        required: false
    environment: *backend_env
    volumes: *backend_volumes
    depends_on:
      - mysql

  explanation-service:
    image: hotel-ai-backend:local
    container_name: hotel-ai-explanation
    restart: unless-stopped
    working_dir: /app/backend/apps/explanation-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8104
    env_file:
      - path: backend/.env
        required: false
    environment: *backend_env
    volumes: *backend_volumes

  audit-service:
    image: hotel-ai-backend:local
    container_name: hotel-ai-audit
    restart: unless-stopped
    working_dir: /app/backend/apps/audit-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8107
    env_file:
      - path: backend/.env
        required: false
    environment: *backend_env
    volumes:
      - .:/app
      - /mnt/data:/mnt/data

  ai-query-service:
    image: hotel-ai-backend:local
    container_name: hotel-ai-query
    restart: unless-stopped
    working_dir: /app/backend/apps/ai-query-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8100
    env_file:
      - path: backend/.env
        required: false
    environment: *backend_env
    volumes: *backend_volumes
    ports:
      - "127.0.0.1:8100:8100"
    depends_on:
      - auth-service
      - metric-service
      - semantic-service
      - sql-guardrail-service
      - db-executor-service
      - explanation-service
      - audit-service

  frontend:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.frontend
    container_name: hotel-ai-frontend
    restart: unless-stopped
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      VITE_PROXY_TARGET: http://ai-query-service:8100
    volumes:
      - .:/app
      - frontend_node_modules:/app/frontend/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - ai-query-service

volumes:
  mysql_data:
  frontend_node_modules:
